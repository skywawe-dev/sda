[package]
name = "sda"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Steam Desktop Authenticator for Windows, in Rust"
repository = "https://github.com/skywawe-dev/sda"
license = "MIT"
readme = "README.md"
keywords = ["steam", "steam-guard", "authenticator", "totp"]
categories = ["authentication", "gui"]

[dependencies]
aes = "0.9.4"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
# glow (OpenGL) only, so wgpu/naga stay out of the build. Bundled fonts plus the
# default ones for emoji and symbols.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
getrandom = "0.4.3"
image = { version = "0.25.5", default-features = false, features = ["jpeg"] }
hmac = "0.13.0"
num-bigint = "0.5.1"
pbkdf2 = "0.13.0"
reqwest = { version = "0.13.5", features = ["blocking", "json", "form", "query"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
window-vibrancy = "0.8.1"
raw-window-handle = "0.6"
arboard = { version = "3.7.0", default-features = false }

[build-dependencies]
# Compiles the .ico into a Win32 resource with rc.exe from the Windows SDK.
winresource = "0.1.34"

# The tray is Windows-only: icon, context menu and its own Win32 message pump.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Globalization",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"

# PBKDF2 at 50 000 rounds takes seconds per file in an unoptimised debug build.
[profile.dev.package."*"]
opt-level = 3
